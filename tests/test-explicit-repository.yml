name: Test repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to commit
        run: echo "test-explicit-repo" > test-explicit-repo.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: repository input coverage"
          repository: "suzuki-shunsuke/commit-action"
          files: test-explicit-repo.txt
          fail_on_self_push: "false"

      - name: Assert action ran (repository input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          # The action will fail because we don't have write access to the
          # upstream repo, but we verify it ran and processed the repository input
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without write access to upstream repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
