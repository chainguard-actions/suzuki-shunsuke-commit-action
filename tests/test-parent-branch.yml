name: Test parent_branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to commit
        run: echo "test-parent-branch" > test-parent-branch.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: parent_branch coverage"
          branch: "test-new-branch-for-coverage"
          parent_branch: "main"
          files: test-parent-branch.txt
          fail_on_self_push: "false"

      - name: Assert action ran (parent_branch input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          SELF_PUSH: ${{ steps.action.outputs.self_push }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "self_push: $SELF_PUSH"
          # The action may fail due to sentinel repo not existing on GitHub,
          # but we verify it ran and processed the parent_branch input
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
