name: Test Parent Branch Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to commit
        run: |
          echo "test-parent-branch-$(date +%s)" > test-parent-branch-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: parent branch commit"
          branch: "new-test-branch-act"
          parent_branch: "act-harness"
          fail_on_self_push: "false"

      - name: Assert action ran with parent_branch input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "sha: $SHA"
          # The action may fail because GITHUB_REPOSITORY is a sentinel and API calls will 404.
          # What matters is that the action accepted the parent_branch input and ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with parent_branch input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
