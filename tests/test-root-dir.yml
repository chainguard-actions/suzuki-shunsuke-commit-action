name: Test Root Dir Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file in a subdirectory
        run: |
          mkdir -p test-subdir
          echo "test-root-dir-$(date +%s)" > test-subdir/test-root-dir-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: root_dir input commit"
          branch: act-harness
          root_dir: "test-subdir"
          fail_on_self_push: "false"

      - name: Assert action ran with root_dir input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "sha: $SHA"
          # The action may fail because GITHUB_REPOSITORY is a sentinel and API calls will 404.
          # What matters is that the action accepted the root_dir input and ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with root_dir input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
