name: Test root_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file in a subdirectory to use as root_dir
        run: |
          mkdir -p /tmp/root-dir-test
          echo "test-root-dir-$(date +%s)" > /tmp/root-dir-test/changed.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: root_dir input commit"
          root_dir: "/tmp/root-dir-test"
          files: /tmp/root-dir-test/changed.txt

      - name: Assert action ran (fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
