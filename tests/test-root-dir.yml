name: Test root_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory and file to commit
        run: |
          mkdir -p subdir
          echo "test-root-dir" > subdir/test-root-dir.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: root_dir input coverage"
          root_dir: "subdir"
          files: test-root-dir.txt
          fail_on_self_push: "false"

      - name: Assert action ran (root_dir input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          # The action may fail due to sentinel repo not existing on GitHub,
          # but we verify it ran and processed the root_dir input
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
