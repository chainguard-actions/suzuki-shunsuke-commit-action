name: Test root_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file in a subdirectory
        run: |
          mkdir -p subdir
          echo "test-root-dir-$(date +%s)" > subdir/test-root-dir.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          root_dir: subdir
          commit_message: "test: root_dir input coverage"
          files: test-root-dir.txt
          fail_on_self_push: "false"
      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with root_dir input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
