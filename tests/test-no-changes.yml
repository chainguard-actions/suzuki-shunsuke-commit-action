name: Test no changes scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With empty_commit=false (default) and no modified files,
      # the action should either skip the commit (pushed=false/sha empty)
      # or fail gracefully because the sentinel repo is not resolvable.
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: no changes"
          empty_commit: "false"
          fail_on_self_push: "false"
          branch: act-harness

      - name: Assert action ran gracefully with no changes
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
          PUSHED: ${{ steps.action.outputs.pushed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha:     $SHA"
          echo "pushed:  $PUSHED"
          if [ "$OUTCOME" = "success" ]; then
            # No files changed, so pushed should be false and sha empty
            if [ "$PUSHED" = "true" ] && [ -z "$SHA" ]; then
              echo "FAIL: pushed=true but sha is empty"
              exit 1
            fi
            echo "PASS: action succeeded; pushed='$PUSHED' sha='$SHA'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
