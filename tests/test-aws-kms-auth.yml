name: Test aws_kms_key_id, aws_region, and aws_role_to_assume inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "123456"
          aws_kms_key_id: "arn:aws:kms:us-east-1:123456789012:key/fake-key-id"
          aws_region: "us-east-1"
          aws_role_to_assume: "arn:aws:iam::123456789012:role/fake-role"
          commit_message: "test: cover aws_kms_key_id, aws_region, aws_role_to_assume inputs"
          empty_commit: "true"
          fail_on_self_push: "false"

      - name: Assert action ran (expected to fail with invalid AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid AWS/KMS credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (inputs were accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
