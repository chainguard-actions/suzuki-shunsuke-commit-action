name: Test GitHub App authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "app auth test content" > /tmp/app-test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "12345"
          app_private_key: "fake-private-key-for-testing"
          branch: feature-branch
          parent_branch: main
          repository: test-owner/test-repo
          root_dir: /tmp
          commit_message: "test commit via app auth"
          files: /tmp/app-test-file.txt
          fail_on_self_push: "false"
          workflow: allow
      - name: Assert action ran with app auth inputs
        run: |
          echo "pushed: ${{ steps.action.outputs.pushed }}"
          echo "sha: ${{ steps.action.outputs.sha }}"
          echo "self_push: ${{ steps.action.outputs.self_push }}"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to fake app credentials, but it should have run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with app auth inputs (outcome=${{ steps.action.outcome }})"
