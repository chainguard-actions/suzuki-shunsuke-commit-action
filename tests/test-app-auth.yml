name: Test app_id and app_private_key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to commit
        run: |
          echo "test-app-auth-$(date +%s)" > test-app-auth.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "123456"
          app_private_key: "fake-private-key-for-coverage"
          commit_message: "test: app_id and app_private_key input coverage"
          branch: act-harness
          files: test-app-auth.txt

      - name: Assert action ran (expected to fail with invalid app credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid app credentials (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
