name: Test GitHub App authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_REF_NAME: main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: example/repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "12345"
          app_private_key: "fake-private-key-for-coverage"
          commit_message: "test commit via app"
          branch: main
          repository: ${{ github.repository }}
          empty_commit: "true"
          fail_on_self_push: "false"
          workflow: allow
      - name: Assert action ran (expected to fail with invalid app credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome (failure expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
