name: Test app authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_REF_NAME: feature-branch
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file in workspace
        run: |
          echo "app auth test content" > test-app-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "12345"
          app_private_key: "fake-private-key-for-input-coverage"
          commit_message: "test commit via app"
          branch: feature-branch
          parent_branch: main
          repository: test-owner/test-repo
          root_dir: ${{ github.workspace }}
          files: test-app-file.txt
          list_files_by_git: "false"
          fail_on_self_push: "false"
          workflow: allow
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with fake credentials, but inputs must be accepted
          echo "PASS: action executed with app_id, app_private_key, parent_branch, root_dir inputs"
