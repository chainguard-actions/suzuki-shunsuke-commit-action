name: Test app_id, app_private_key, parent_branch, root_dir inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_REF_NAME: feature-branch
      GITHUB_REPOSITORY: suzuki-shunsuke/commit-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file in root_dir
        run: |
          mkdir -p /tmp/test-root-dir
          echo "app auth test content $(date)" > /tmp/test-root-dir/test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "12345"
          app_private_key: "fake-private-key-for-input-coverage"
          parent_branch: main
          root_dir: /tmp/test-root-dir
          branch: feature-branch
          commit_message: "test commit via app auth"
          fail_on_self_push: "false"
      - name: Assert action ran with app auth inputs
        run: |
          echo "pushed: ${{ steps.action.outputs.pushed }}"
          echo "sha: ${{ steps.action.outputs.sha }}"
          echo "self_push: ${{ steps.action.outputs.self_push }}"
          echo "PASS: action ran with app_id, app_private_key, parent_branch, root_dir inputs"
