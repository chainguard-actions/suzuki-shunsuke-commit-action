name: Test GitHub App Authentication Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to commit
        run: |
          echo "test-app-auth-$(date +%s)" > test-app-auth-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          app_id: "123456"
          app_private_key: "fake-private-key-for-testing"
          commit_message: "test: app auth commit"
          branch: act-harness
          fail_on_self_push: "false"

      - name: Assert action ran with app_id and app_private_key inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          # The action may fail because the app credentials are fake or the repo is a sentinel.
          # What matters is that the action accepted the app_id and app_private_key inputs
          # and ran (did not error on missing inputs).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with app auth inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake app credentials or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
