name: Test github_token, root_dir, and parent_branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to commit
        run: |
          mkdir -p hardened/tests/fixtures/root-dir-test
          echo "test content $(date)" > hardened/tests/fixtures/root-dir-test/test-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          root_dir: hardened/tests/fixtures/root-dir-test
          parent_branch: main
          commit_message: "test: cover github_token, root_dir, parent_branch inputs"
          empty_commit: "true"
          fail_on_self_push: "false"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          SHA: ${{ steps.action.outputs.sha }}
          SELF_PUSH: ${{ steps.action.outputs.self_push }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "sha: $SHA"
          echo "self_push: $SELF_PUSH"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
