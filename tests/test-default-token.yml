name: Test default token authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          empty_commit: "true"
          commit_message: "test: default token auth"
          branch: act-harness
          repository: ${{ github.repository }}
          fail_on_self_push: "false"
          # No github_token set — uses default_github_token (${{ github.token }})

      - name: Assert action ran with default token (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
          PUSHED: ${{ steps.action.outputs.pushed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha:     $SHA"
          echo "pushed:  $PUSHED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but sha output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with sha=$SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
