name: Test repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file change
        run: echo "test-repository-$(date +%s)" > /tmp/repository-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: repository input commit"
          repository: "octocat/Hello-World"
          files: /tmp/repository-test.txt

      - name: Assert action ran (fails gracefully with non-writable or non-existent repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with non-writable repository)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
