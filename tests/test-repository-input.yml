name: Test Repository Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to commit
        run: |
          echo "test-repository-input-$(date +%s)" > test-repository-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_message: "test: repository input commit"
          branch: act-harness
          repository: "suzuki-shunsuke/commit-action"
          fail_on_self_push: "false"

      - name: Assert action ran with repository input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "sha: $SHA"
          # The action may fail because the token may not have write access to the specified repo,
          # or the repo is not the sentinel. What matters is that the action accepted the
          # repository input and ran (did not error on missing inputs).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with repository input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no write access to external repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
