name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_REF_NAME: main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: example/repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          commit_message: "test commit"
          branch: main
          repository: ${{ github.repository }}
          files: |
            README.md
          root_dir: .
          parent_branch: main
          empty_commit: "true"
          fail_on_self_push: "false"
      - name: Assert action ran (outputs present or action errored gracefully)
        env:
          PUSHED: ${{ steps.action.outputs.pushed }}
          SELF_PUSH: ${{ steps.action.outputs.self_push }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "self_push: $SELF_PUSH"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
