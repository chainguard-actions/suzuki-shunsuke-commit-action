name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REF_NAME: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "test content" > /tmp/test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          commit_message: "test commit"
          branch: main
          repository: ${{ github.repository }}
          files: /tmp/test-file.txt
          list_files_by_git: "false"
          fail_on_self_push: "false"
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "pushed: ${{ steps.action.outputs.pushed }}"
          echo "self_push: ${{ steps.action.outputs.self_push }}"
          # The action may fail due to API errors in test env, but it should have run
          echo "PASS: action executed"
