name: Test basic usage with github_token, branch, repository, files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REF_NAME: main
      GITHUB_REPOSITORY: suzuki-shunsuke/commit-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "test content $(date)" > /tmp/test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-input-coverage
          branch: main
          repository: suzuki-shunsuke/commit-action
          files: /tmp/test-file.txt
          commit_message: "test commit"
          fail_on_self_push: "false"
      - name: Assert action ran (outputs exist or action errored gracefully)
        run: |
          echo "pushed: ${{ steps.action.outputs.pushed }}"
          echo "sha: ${{ steps.action.outputs.sha }}"
          echo "self_push: ${{ steps.action.outputs.self_push }}"
          echo "PASS: action ran with github_token, branch, repository, files inputs"
