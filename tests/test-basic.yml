name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "test content" > /tmp/test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          branch: main
          repository: test-owner/test-repo
          commit_message: "test commit"
          files: /tmp/test-file.txt
          fail_on_self_push: "false"
      - name: Assert action ran (outputs present or action errored gracefully)
        run: |
          echo "pushed: ${{ steps.action.outputs.pushed }}"
          echo "sha: ${{ steps.action.outputs.sha }}"
          echo "self_push: ${{ steps.action.outputs.self_push }}"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to fake token, but it should have run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
