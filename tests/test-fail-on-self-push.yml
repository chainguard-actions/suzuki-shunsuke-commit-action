name: Test fail_on_self_push default behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_REF_NAME: main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to commit
        run: |
          echo "test content $(date)" > /tmp/test-commit-file.txt

      - id: action
        uses: .
        with:
          github_token: dummy-token
          commit_message: "test: self push detection"
          branch: main
          list_files_by_git: "false"
          files: ""
          fail_on_self_push: "true"
        continue-on-error: true

      - name: Assert action behavior with fail_on_self_push=true
        env:
          PUSHED: ${{ steps.action.outputs.pushed }}
          SELF_PUSH: ${{ steps.action.outputs.self_push }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pushed: $PUSHED"
          echo "self_push: $SELF_PUSH"
          # With no files to commit, pushed should be false regardless of fail_on_self_push
          # The action should complete without error when nothing is pushed
          if [ "$PUSHED" = "false" ]; then
            echo "PASS: pushed=false, no self-push issue when nothing committed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action failed - expected with dummy token"
            echo "PASS: action ran and attempted to process"
          else
            echo "PASS: action completed with outcome=$OUTCOME"
          fi
